[build-system]
requires = [
    "setuptools>=69",
    "setuptools-scm[toml]>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "tempusonebt"
description = "Backtest trading strategies in Python"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Zach Luster" },
]
keywords = [
    "algo",
    "algorithmic",
    "ashi",
    "backtest",
    "backtesting",
    "bitcoin",
    "bokeh",
    "bonds",
    "candle",
    "candlestick",
    "cboe",
    "chart",
    "cme",
    "commodities",
    "crash",
    "crypto",
    "currency",
    "doji",
    "drawdown",
    "equity",
    "etf",
    "ethereum",
    "exchange",
    "finance",
    "financial",
    "forecast",
    "forex",
    "fund",
    "futures",
    "fx",
    "fxpro",
    "gold",
    "heiken",
    "historical",
    "indicator",
    "invest",
    "investing",
    "investment",
    "macd",
    "market",
    "mechanical",
    "money",
    "oanda",
    "ohlc",
    "ohlcv",
    "order",
    "price",
    "profit",
    "quant",
    "quantitative",
    "rsi",
    "silver",
    "simulation",
    "stocks",
    "strategy",
    "ticker",
    "trader",
    "trading",
    "tradingview",
    "usd",
]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.17.0",
    "pandas>=0.25.0,!=0.25.0",
    "bokeh>=3.0.0,!=3.0.*,!=3.2.*",
]
dynamic = ["version"]

[project.optional-dependencies]
doc = [
    "pdoc3",
    "jupytext>=1.3",
    "nbconvert",
    "ipykernel",
    "jupyter_client",
]
test = [
    "matplotlib",
    "scikit-learn",
    "sambo; python_version >= '3.10'",
    "tqdm",
    "ipywidgets",
]
dev = [
    "flake8",
    "coverage",
    "mypy",
]

[project.urls]
Documentation = "https://kernc.github.io/backtesting.py/doc/backtesting/"
Source = "https://github.com/kernc/backtesting.py/"
Tracker = "https://github.com/kernc/backtesting.py/issues"

[tool.setuptools.packages.find]
include = ["tempusonebt*"]

[tool.setuptools.package-data]
tempusonebt = [
    "autoscale_cb.js",
]
"tempusonebt.test" = [
    "*.csv",
]

[tool.setuptools_scm]
write_to = "tempusonebt/_version.py"

[tool.ruff]
exclude = [
    '.git',
    '.eggs',
    '__pycache__',
    'doc/examples',
]
ignore = [
    'UP006',
    'UP007',
    'UP009',
    'N802',
    'N806',
    'C901',
    'B008',
    'B011',
    'RUF002',
]
line-length = 100
select = [
    'I',
    'E',
    'F',
    'W',
    'UP',
    'N',
    'C',
    'B',
    'T',
    'RUF',
    'YTT',
]

[tool.ruff.pep8-naming]
ignore-names = [
    'l',
    'h',
]
