[build-system]
requires = [
    "setuptools>=69",
    "setuptools-scm[toml]>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "tempusonebt"
description = "Backtest trading strategies in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "TempusOneBt" },
]
keywords = [
    "algo",
    "algorithmic",
    "backtest",
    "backtesting",
    "bokeh",
    "candlestick",
    "crypto",
    "finance",
    "forex",
    "indicator",
    "ohlc",
    "ohlcv",
    "quant",
    "quantitative",
    "simulation",
    "stocks",
    "strategy",
    "trading",
]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.17.0",
    "pandas>=0.25.0,!=0.25.0",
    "bokeh>=3.0.0,!=3.0.*,!=3.2.*",
]
dynamic = ["version"]

[project.optional-dependencies]
doc = [
    "pdoc3",
    "jupytext>=1.3",
    "nbconvert",
    "ipykernel",
    "jupyter_client",
]
test = [
    "matplotlib",
    "scikit-learn",
    "sambo",
    "tqdm",
    "ipywidgets",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "coverage",
]

[project.urls]
Homepage = "https://github.com/tempusoneps/tempusonebt"
Repository = "https://github.com/tempusoneps/tempusonebt"
Issues = "https://github.com/tempusoneps/tempusonebt/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tempusonebt*"]

[tool.setuptools.package-data]
tempusonebt = [
    "autoscale_cb.js",
    "py.typed",
]
"tempusonebt.datasets" = [
    "*.csv",
]
"tempusonebt.test" = [
    "*.csv",
]

[tool.setuptools_scm]
write_to = "src/tempusonebt/_version.py"

[tool.ruff]
exclude = [
    ".git",
    ".eggs",
    "__pycache__",
    "examples",
]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "I",
    "E",
    "F",
    "W",
    "UP",
    "N",
    "C",
    "B",
    "T",
    "RUF",
    "YTT",
]
ignore = [
    "N802",
    "N806",
    "N812",
    "C901",
    "C408",
    "B008",
    "B011",
    "B905",
    "RUF002",
    "E501",
]

[tool.ruff.lint.pep8-naming]
ignore-names = [
    "l",
    "h",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false
